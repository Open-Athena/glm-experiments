_target_: glm_experiments.models.lm_lit_module.SimCSELitModule

soft_masked_weight: ${data.soft_masked_weight}
evals: ${data.evals}

net:
  _target_: glm_experiments.models.components.lm.SimCSE
  embedder:
    _target_: glm_experiments.models.components.transformer.Embedding
    vocab_size: 7
    d_model: 512
  encoder:
    _target_: glm_experiments.models.components.transformer.Transformer
    hidden_size: ${..embedder.d_model} # 512
    n_layers: 6
    num_heads: 8 # 8 heads → d_head = 64
    # d_ff: auto-computed as floor(512 * 8/3 / 64) * 64 = 1344
    rope_theta: 10000.0
    is_causal: false # Bidirectional for SimCSE
    dropout: 0.1 # Required for SimCSE contrastive signal
  layer_norm:
    _target_: torch.nn.RMSNorm
    normalized_shape: ${..embedder.d_model}
  dropout_p: ${.encoder.dropout}
  temperature: 0.05

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001 # CS336 default
  weight_decay: 0.1 # CS336 default
  betas: [0.9, 0.98] # CS336 default (beta1, beta2)
  eps: 1.0e-9 # CS336 default

scheduler:
  _target_: transformers.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 500
