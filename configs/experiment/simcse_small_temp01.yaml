# @package _global_

defaults:
  - override /data: gpn_animal_promoter
  - override /model: simcse_transformer_small
  - override /trainer: gpn_animal_promoter

logger:
  wandb:
    name: simcse-small-temp0.1
    tags: ["simcse", "small", "temperature-sweep"]

data:
  _target_: glm_experiments.data.lm_datamodule.SimCSEDataModule
  dataset_name: songlab/gpn-animal-promoter-dataset
  batch_size: 256
  per_device_batch_size: 256
  num_workers: 4

model:
  net:
    mlp_projection:
      _target_: torch.nn.Sequential
      _args_:
        - _target_: torch.nn.Linear
          in_features: 512
          out_features: 512
        - _target_: torch.nn.GELU
        - _target_: torch.nn.Linear
          in_features: 512
          out_features: 512
    temperature: 0.1
  optimizer:
    lr: 0.0001
  scheduler:
    _target_: transformers.get_cosine_with_min_lr_schedule_with_warmup
    _partial_: true
    num_warmup_steps: 2000
    num_training_steps: ${trainer.max_steps}
    min_lr_rate: 0.1

callbacks:
  model_checkpoint:
    every_n_train_steps: 100
    save_top_k: -1

trainer:
  devices: 1
  strategy: auto
  max_steps: 2000
  log_every_n_steps: 100
  val_check_interval: 100
